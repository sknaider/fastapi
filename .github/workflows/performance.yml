name: Performance Regression Tests

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  performance-tests:
    name: Performance Benchmark
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -e ".[all]"
        pip install httpx

    - name: Download baseline
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: performance-baseline
        path: .

    - name: Start test server
      run: |
        # Create a simple test app
        cat > test_app.py <<EOF
        from fastapi import FastAPI
        app = FastAPI()

        @app.get("/")
        def read_root():
            return {"message": "Hello World"}

        @app.get("/slow")
        async def slow_endpoint():
            import asyncio
            await asyncio.sleep(0.1)
            return {"message": "Slow response"}

        @app.get("/items/{item_id}")
        def read_item(item_id: int):
            return {"item_id": item_id}
        EOF

        # Start server in background
        pip install uvicorn
        uvicorn test_app:app --host 0.0.0.0 --port 8000 &

        # Wait for server to start
        sleep 5

    - name: Run performance benchmarks
      run: |
        python scripts/performance_tests.py \
          --iterations 50 \
          --output performance-results.json \
          --baseline performance-baseline.json \
          --threshold 15

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results
        path: performance-results.json
        retention-days: 90

    - name: Update baseline (on master)
      if: github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: performance-baseline
        path: performance-results.json
        retention-days: 90

    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const results = JSON.parse(fs.readFileSync('performance-results.json'));

          let comment = '## 📊 Performance Benchmark Results\n\n';
          comment += '| Endpoint | Mean | Median | P95 | P99 |\n';
          comment += '|----------|------|--------|-----|-----|\n';

          for (const result of results.results) {
            comment += `| ${result.endpoint} | ${result.mean_ms.toFixed(2)}ms | ${result.median_ms.toFixed(2)}ms | ${result.p95_ms.toFixed(2)}ms | ${result.p99_ms.toFixed(2)}ms |\n`;
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
